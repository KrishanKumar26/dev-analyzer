spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vortex_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Kk9397@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:VortexSecretKey2024SuperLongSecretKeyForJWTTokenGeneration}
jwt.expiration=86400000

server.port=${PORT:8080}

# Memory tuning for low-RAM (256MB) hosting plans
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false

# Don't fail startup if Neon's compute is cold-starting on the first connection attempt
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect