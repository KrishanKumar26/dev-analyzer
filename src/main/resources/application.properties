spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vortex_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# Secret: provided only via the DATABASE_PASSWORD env var, never committed
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Secret: provided only via the JWT_SECRET env var, never committed
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Optional GitHub API token (env var only). Set karo to rate limit 60/hr -> 5000/hr
github.token=${GITHUB_TOKEN:}

# Optional Google Gemini API key for AI Career Coach (free tier) — env var only, never committed
gemini.api.key=${GEMINI_API_KEY:}

server.port=${PORT:8080}

# Memory tuning for low-RAM (256MB) hosting plans
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jmx.enabled=false

# Don't fail startup if Neon's compute is cold-starting on the first connection attempt
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect